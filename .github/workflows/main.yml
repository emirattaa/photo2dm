name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project source (if present)
        run: |
          if [ -f "android-sample-app.zip" ]; then
            echo "android-sample-app.zip bulundu, aÃ§Ä±lÄ±yor..."
            unzip -o android-sample-app.zip -d .
            echo "Zip iÃ§eriÄŸi aÃ§Ä±ldÄ±."
          else
            echo "android-sample-app.zip bulunamadÄ±, mevcut proje kÃ¶k dizini kullanÄ±lacak."
          fi

      - name: Detect project root
        id: detect
        run: |
          if [ -f "android-sample-app/gradlew" ]; then
            echo "project_dir=android-sample-app" >> "$GITHUB_OUTPUT"
          else
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper (if wrapper jar is missing)
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar bulunamadÄ±, Ã¼retiliyor..."
            gradle wrapper --gradle-version 8.7
          else
            echo "gradle-wrapper.jar zaten mevcut."
          fi

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate generated APK
        id: locate_apk
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          APK_PATH=$(find . -type f -path "*/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "HATA: Release APK dosyasÄ± bulunamadÄ±!"
            exit 1
          fi
          echo "APK bulundu: $APK_PATH"
          echo "apk_path=${{ steps.detect.outputs.project_dir }}/${APK_PATH#./}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          body: |
            Bu release, GitHub Actions tarafÄ±ndan otomatik olarak Ã¼retilmiÅŸtir.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: ${{ steps.locate_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
