name: Build APK from source zip

# Bu workflow, repo kÃ¶k dizinindeki (veya source/ klasÃ¶rÃ¼ndeki) *.zip kaynak
# kodunu bulur, aÃ§ar, Gradle ile derler ve Ã§Ä±kan APK'yÄ± otomatik olarak
# GitHub Releases'e yÃ¼kler.
#
# KullanÄ±m:
#   1) EdgeLightPlus-source.zip dosyasÄ±nÄ± repo kÃ¶kÃ¼ne (veya source/ klasÃ¶rÃ¼ne) koyun.
#   2) Bu dosyayÄ± .github/workflows/build-apk.yml olarak ekleyin.
#   3) Actions sekmesinden "Build APK from source zip" workflow'unu elle Ã§alÄ±ÅŸtÄ±rÄ±n
#      (workflow_dispatch) ya da zip dosyasÄ±nÄ± push edin.
#   4) Derleme bitince Releases sekmesinde APK'yÄ± bulacaksÄ±nÄ±z.

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu Ã§ek
        uses: actions/checkout@v4

      - name: Kaynak zip dosyasÄ±nÄ± bul
        id: findzip
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "Repo iÃ§inde .zip kaynak dosyasÄ± bulunamadÄ±. Zip dosyasÄ±nÄ± repo kÃ¶kÃ¼ne veya source/ klasÃ¶rÃ¼ne ekleyin." >&2
            exit 1
          fi
          echo "Bulunan zip: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Zip'i aÃ§
        run: |
          mkdir -p project
          unzip -q "${{ steps.findzip.outputs.zip_path }}" -d project
          # Zip iÃ§inde tek bir Ã¼st klasÃ¶r varsa (Ã¶r: EdgeLightPlus/), gradle
          # dosyalarÄ±nÄ± bulmak iÃ§in o klasÃ¶rÃ¼n iÃ§ine iniyoruz.
          if [ ! -f project/settings.gradle ] && [ ! -f project/settings.gradle.kts ]; then
            INNER_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$INNER_DIR" ]; then
              mv "$INNER_DIR"/* project/ 2>/dev/null || true
              mv "$INNER_DIR"/.[!.]* project/ 2>/dev/null || true
            fi
          fi
          echo "Proje iÃ§eriÄŸi:"
          ls -la project

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK lisanslarÄ±nÄ± kabul et
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle kur ve APK derle
        uses: gradle/actions/setup-gradle@v3

      - name: Debug APK derle
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: APK dosyasÄ±nÄ± bul
        id: findapk
        run: |
          APK_PATH=$(find project -iname "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Derleme sonunda APK bulunamadÄ±." >&2
            exit 1
          fi
          echo "Bulunan APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Release oluÅŸtur ve APK'yÄ± ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Otomatik build #${{ github.run_number }}"
          files: ${{ steps.findapk.outputs.apk_path }}
          generate_release_notes: false
