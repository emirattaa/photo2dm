name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Repo kÃ¶kÃ¼ndeki zip dosyasÄ±nÄ±n adÄ± ve iÃ§inden Ã§Ä±kan proje klasÃ¶rÃ¼nÃ¼n adÄ±.
  ZIP_NAME: EdgeLightingPlus.zip
  PROJECT_DIR: EdgeLightingPlus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::$ZIP_NAME repo kÃ¶kÃ¼nde bulunamadÄ±."
            exit 1
          fi
          rm -rf "$PROJECT_DIR"
          unzip -q "$ZIP_NAME" -d .
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Unzip sonrasÄ± $PROJECT_DIR/settings.gradle.kts bulunamadÄ±. Zip iÃ§indeki klasÃ¶r adÄ±nÄ± kontrol edin."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy APK to workspace root
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" EdgeLightingPlus.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLightingPlus-apk
          path: EdgeLightingPlus.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EdgeLightingPlus.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
